name: BANIQL CORP.
description: BANIQL CORP. (BANiQL) is developing a sustainable process for selectively extracting nickel
  and cobalt for use in lithium-ion battery production. Its core technology uses a chemical process to
  selectively extract nickel and cobalt from raw materials at lower temperatures and atmospheric pressure,
  producing high-quality nickel at roughly 30% lower cost than High Pressure Acid Leaching (HPAL) with
  net-zero waste, cutting energy consumption and carbon dioxide emissions by around 80% while repurposing
  leftover materials into products like fertilizers and construction materials. Surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network; this materials/cleantech company publishes
  no developer or API surface, so this profile carries company identity and domain-security data only.
